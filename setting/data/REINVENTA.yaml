name: REINVENTA
dir: resource/dataset/REINVENTA/

folds: [ 0, 1, 2, 3, 4]
splits: [ "train", "val", "test" ]


text_max_length: 256
label_max_length: 16
vocabulary_size: 10000

num_labels: 686
num_texts: 45370
num_relevant_labels: 1

llm:
  prompt_opt:
    model: mistralai/Mistral-7B-Instruct-v0.2
    num_targets_labels: 6
    num_samples_per_target_label: 16

batch_size: 32
num_workers: 6

label_enhancement: NONE
pseudo_labels: apmi_pseudo_labels
text_features_source: TXT

model: mistralai/Mixtral-8x7B-Instruct-v0.1

propensity:
  A: 0.55
  B: 1.5